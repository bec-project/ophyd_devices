name: Bug report
description: File a bug report.
title: "[BUG]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Bug report:
  - type: textarea
    id: description
    attributes:
      label: Provide a brief description of the bug.
  - type: textarea
    id: expected
    attributes:
      label: Describe what you expected to happen and what actually happened.
  - type: textarea
    id: reproduction
    attributes:
      label: Outline the steps that lead to the bug's occurrence. Be specific and provide a clear sequence of actions.
  - type: input
    id: version
    attributes:
      label: ophyd_devices version
      description: Which version of ophyd_devices was running?
  - type: input
    id: bec-version
    attributes:
      label: bec core version
      description: which version of BEC core was running?
  - type: input
    id: device
    attributes:
      label: Device class and hardware
      description: >-
        Include the device class, hardware model and firmware, or state simulation/mock only.
  - type: textarea
    id: environment
    attributes:
      label: Environment and device configuration
      description: >-
        Include Python/OS versions and a minimal device configuration, with credentials removed.
  - type: textarea
    id: extra
    attributes:
      label: Any extra info / data? e.g. log output...
  - type: input
    id: issues
    attributes:
      label: Related issues
      description: please tag any related issues
